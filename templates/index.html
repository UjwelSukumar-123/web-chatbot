<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot (Powered by Gemini)</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #6a11cb 0%, #2575fc 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .chat-container {
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-header {
            background-color: #2575fc;
            color: white;
            padding: 20px;
            font-size: 1.5em;
            font-weight: 700;
            text-align: center;
            border-bottom: 1px solid #1a5ac5;
            letter-spacing: 1px;
        }

        .chat-box {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            max-height: 500px; /* Limit chat box height */
            background-color: #f9f9f9;
            border-bottom: 1px solid #eee;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-bubble {
            padding: 12px 18px;
            border-radius: 20px;
            max-width: 75%;
            word-wrap: break-word;
            line-height: 1.6;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message-bubble.user {
            background-color: #e0f2f7; /* Light blue */
            color: #333;
            border-bottom-right-radius: 5px;
        }

        .message-bubble.bot {
            background-color: #d1c4e9; /* Light purple */
            color: #333;
            border-bottom-left-radius: 5px;
        }

        .source-links { /* Changed from .source-link to .source-links */
            font-size: 0.8em;
            margin-top: 5px;
            color: #666;
            display: block;
        }
        .source-links a {
            color: #2575fc;
            text-decoration: none;
            font-weight: bold;
            margin-right: 8px; /* Spacing between multiple links */
            display: inline-block; /* Allow links to wrap */
        }
        .source-links a:hover {
            text-decoration: underline;
        }

        .chat-input-area {
            display: flex;
            padding: 20px;
            background-color: #fff;
            border-top: 1px solid #eee;
        }

        .chat-input-area input[type="text"] {
            flex-grow: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input-area input[type="text"]:focus {
            border-color: #2575fc;
            box-shadow: 0 0 8px rgba(37, 117, 252, 0.2);
        }

        .chat-input-area button {
            background-color: #2575fc;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 20px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 700;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .chat-input-area button:hover {
            background-color: #1a5ac5;
            transform: translateY(-2px);
        }

        .chat-input-area button:active {
            transform: translateY(0);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .chat-container {
                width: 95%;
                margin: 20px;
            }
            .chat-header {
                font-size: 1.2em;
                padding: 15px;
            }
            .chat-box {
                padding: 15px;
                max-height: 400px;
            }
            .message-bubble {
                padding: 10px 15px;
                font-size: 0.9em;
            }
            .chat-input-area {
                flex-direction: column;
                padding: 15px;
            }
            .chat-input-area input[type="text"] {
                margin-bottom: 10px;
                width: calc(100% - 30px); /* Adjust for padding */
            }
            .chat-input-area button {
                width: 100%;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            AI CHATBOT
        </div>
        <div class="chat-box" id="chat-box">
            <div class="message bot">
                <div class="message-bubble bot">
                    Hello! Ask me anything
                </div>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Type your question...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const userInput = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const question = userInput.value.trim();

            if (question === '') {
                return;
            }

            // Display user message
            const userMessageDiv = document.createElement('div');
            userMessageDiv.className = 'message user';
            userMessageDiv.innerHTML = `<div class="message-bubble user">${question}</div>`;
            chatBox.appendChild(userMessageDiv);

            userInput.value = ''; // Clear input field
            chatBox.scrollTop = chatBox.scrollHeight; // Scroll to bottom

            // Display "Typing..." message
            const typingMessageDiv = document.createElement('div');
            typingMessageDiv.className = 'message bot';
            typingMessageDiv.id = 'typing-indicator';
            typingMessageDiv.innerHTML = `<div class="message-bubble bot">Typing...</div>`;
            chatBox.appendChild(typingMessageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;


            // Send question to Flask backend
            fetch('/ask', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `question=${encodeURIComponent(question)}`
            })
            .then(response => response.json())
            .then(data => {
                // Remove "Typing..." message
                const typingIndicator = document.getElementById('typing-indicator');
                if (typingIndicator) {
                    typingIndicator.remove();
                }

                const botMessageDiv = document.createElement('div');
                botMessageDiv.className = 'message bot';
                let botMessageContent = `<div class="message-bubble bot">${data.answer}`;

                if (data.source_urls && data.source_urls.length > 0) {
                    let sourceLinksHtml = '<div class="source-links">Source(s): ';
                    data.source_urls.forEach(url => {
                        sourceLinksHtml += `<a href="${url}" target="_blank">${new URL(url).hostname}</a>`;
                    });
                    sourceLinksHtml += '</div>';
                    botMessageContent += sourceLinksHtml;
                }
                botMessageContent += `</div>`;
                botMessageDiv.innerHTML = botMessageContent;
                chatBox.appendChild(botMessageDiv);
                chatBox.scrollTop = chatBox.scrollHeight; 
            })
            .catch(error => {
                console.error('Error:', error);
                // Remove "Typing..." message on error
                const typingIndicator = document.getElementById('typing-indicator');
                if (typingIndicator) {
                    typingIndicator.remove();
                }

                const errorMessageDiv = document.createElement('div');
                errorMessageDiv.className = 'message bot';
                errorMessageDiv.innerHTML = `<div class="message-bubble bot">Sorry, an error occurred while fetching the response. Please try again.</div>`;
                chatBox.appendChild(errorMessageDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        // Allow sending message with Enter key
        document.getElementById('user-input').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        // Scroll to bottom on initial load (for potential pre-existing messages)
        document.addEventListener('DOMContentLoaded', () => {
            const chatBox = document.getElementById('chat-box');
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
